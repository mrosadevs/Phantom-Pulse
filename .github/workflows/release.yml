name: Release

# Publishes a Windows installer to GitHub Releases whenever a version tag is
# pushed.  This is what makes an update appear in the app — pushing to main
# does nothing on its own, because electron-updater reads Releases, not commits.
#
#   npm version patch      # bumps package.json and creates the tag
#   git push --follow-tags # triggers this workflow
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  release:
    runs-on: windows-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      # winax is a native module, so electron-builder shells out to node-gyp,
      # whose bundled gyp still imports distutils — removed in Python 3.12.
      # Pin 3.11 (which still ships it) and install setuptools as a belt-and-
      # braces shim, or the rebuild fails before packaging starts.
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Provide distutils for node-gyp
        run: python -m pip install --upgrade setuptools

      - name: Install dependencies
        run: npm ci

      - name: Build and publish
        env:
          # Provided automatically; needs the contents:write permission above.
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: npm run release
